services:
  db:
    image: postgres:latest
    container_name: assistant_invoice_db
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "${PGPORT}:${PGPORT}"
    volumes:
      - ./backend/src/models/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql
    networks:
      - invoice_network

  backend:
    build: ./backend
    container_name: assistant_invoice_backend
    restart: always
    env_file:
      - ./.env
    environment:
      - PGHOST=db
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      - db
    networks:
      - invoice_network

  invoice_agent:
    build: ./invoice_agent
    container_name: assistant_invoice_agent
    restart: always
    env_file:
      - ./.env
    environment:
      - PGHOST=db
    ports:
      - "${AGENT_PORT}:${AGENT_PORT}"
    depends_on:
      - db
      - backend
    networks:
      - invoice_network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_BACKEND_URL=${BACKEND_URL}
        - VITE_AGENT_URL=${AGENT_URL}
    container_name: assistant_invoice_frontend
    restart: always
    env_file:
      - ./.env
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - invoice_network

networks:
  invoice_network:
    driver: bridge

volumes:
  postgres_data:
